<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunset — Game control</title>
  <link rel="icon" type="image/svg+xml" href="{{ subdomain }}/favicon.svg">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; color: #222; }
    h1 { font-size: 1.5rem; }
    #status { font-size: 1.2rem; margin: 24px 0; padding: 16px; border-radius: 8px; background: #f0f0f0; }
    #status.running { background: #d4edda; color: #155724; }
    #status.stopped { background: #f8d7da; color: #721c24; }
    button { font-size: 1.1rem; padding: 12px 28px; border: none; border-radius: 8px; background: #dc3545; color: #fff; cursor: pointer; }
    button:disabled { background: #c8a9ad; cursor: not-allowed; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Game control</h1>
  <div id="status">Checking…</div>
  <button id="stop" disabled>Stop PCSX2</button>
  <button id="kill" disabled>Force quit</button>
  <p>After stopping, play uploads your memory cards. Force quit may lose unsaved progress.</p>
  <script>
    const sub = {{ subdomain | tojson }};
    const statusEl = document.getElementById("status");
    const stopBtn = document.getElementById("stop");
    const killBtn = document.getElementById("kill");

    async function refresh() {
      try {
        const r = await fetch(sub + "/status");
        const d = await r.json();
        if (d.running) {
          statusEl.textContent = d.sessions.map(s => s.emulator + (s.game ? ": " + s.game : "") + (s.stopping ? " (stopping…)" : "")).join("; ");
          stopBtn.disabled = !d.sessions.some(s => s.emulator === "PCSX2" && !s.stopping);
          statusEl.className = "running";
          killBtn.disabled = false;
        } else {
          statusEl.textContent = "No emulator running";
          stopBtn.disabled = true;
          statusEl.className = "stopped";
          killBtn.disabled = true;
        }
      } catch (e) {
        stopBtn.disabled = true;
        killBtn.disabled = true;
        statusEl.textContent = "Error contacting server";
        statusEl.className = "stopped";
      }
    }

    stopBtn.addEventListener("click", async () => {
      stopBtn.disabled = true;
      await fetch(sub + "/stop", { method: "POST" });
      refresh();
    });

    killBtn.addEventListener("click", async () => {
      if (!confirm("Force-quit running emulators? Unsaved progress may be lost.")) return;
      killBtn.disabled = true;
      await fetch(sub + "/kill", { method: "POST" });
      refresh();
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
