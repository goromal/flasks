<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus</title>
  <link rel="icon" type="image/svg+xml" href="{{ subdomain }}/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ansi_up@5/ansi_up.min.js"></script>
  <style>
    body { background: #f8f9fa; }
    .log-box {
      background: #1e1e1e; color: #d4d4d4; font-family: monospace;
      font-size: 0.85rem; border-radius: 6px; padding: 12px;
      height: 380px; overflow-y: auto; white-space: pre-wrap;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .dot.on { background: #28a745; }
    .dot.off { background: #adb5bd; }
    .machine-table td { vertical-align: middle; }
    .host-name { font-weight: 600; font-size: 1.15rem; text-decoration: none; }
    .host-name:hover { text-decoration: underline; }
    .home-btn { font-weight: 600; padding: .45rem 1.1rem; }
    /* One line of machine tabs; scrolls sideways instead of wrapping on a phone. */
    #log-tabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; }
    #log-tabs .nav-link { white-space: nowrap; padding: .35rem .75rem; }
    /* The active tab shares the log box's dark fill so it reads as attached. */
    #log-tabs .nav-link.active { background: #1e1e1e; color: #d4d4d4; border-color: #1e1e1e; }
    #log-tabs:not(:empty) + .log-box { border-top-left-radius: 0; }
    .row-offline .host-name { opacity: .6; }
    /* Last-known list shown from the browser cache until the first live response. */
    .stale #machines { opacity: .55; }
    /* Version/meta (often a 40-char commit hash) would otherwise widen the table. */
    .trunc { display: block; max-width: 10rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #health-dialog { background: var(--bs-body-bg); color: var(--bs-body-color); border: 0; border-radius: 8px; padding: 0; width: min(640px, calc(100vw - 32px)); box-shadow: 0 .5rem 2rem rgba(0,0,0,.3); }
    #health-dialog::backdrop { background: rgba(0,0,0,.4); }
    .health-list .check { padding: .5rem 0; border-top: 1px solid var(--bs-border-color); }
    .health-list .check:first-child { border-top: 0; }
    .health-list pre { white-space: pre-wrap; font-size: .8rem; background: var(--bs-tertiary-bg); border-radius: 4px; padding: .5rem; margin: .4rem 0 0; }
    @media (max-width: 575px) {
      .trunc { max-width: 5.5rem; }
      .machine-table > :not(caption) > * > * { padding: .4rem .3rem; }
      /* Stack Home/Health/Forget so the table fits a phone without scrolling. */
      .row-actions { flex-direction: column; align-items: stretch; }
      .home-btn { padding: .4rem .6rem; }
    }
  </style>
</head>
<body>
<div class="container py-4" style="max-width:960px">
  <div class="d-flex align-items-center justify-content-between mb-1">
    <div class="d-flex align-items-center gap-2">
      <h1 class="mb-0">Nexus</h1>
      <span class="badge bg-light text-dark border" id="latest-badge" hidden
            title="ANIX_VERSION on anixpkgs master: what a default upgrade installs"></span>
    </div>
    <button class="btn btn-sm btn-outline-secondary" id="refresh-btn" onclick="refresh(true)">Rediscover</button>
  </div>
  <p class="text-muted mb-4">LAN machines discovered over mDNS from <strong>{{ self_host }}.local</strong>
    <span class="small" id="stale-note" hidden>&middot; showing last known state, refreshing&hellip;</span></p>

  <div class="card mb-4" id="machines-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 machine-table">
          <thead>
            <tr>
              <th style="width:2rem"><input class="form-check-input" type="checkbox" id="select-all" onchange="toggleAll(this.checked)" title="Select all upgradable machines"></th>
              <th>Machine</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="machines">
            <tr><td colspan="4" class="text-muted text-center py-4">Discovering machines&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Bulk upgrade</h5>
      <form id="upgrade-form">
        <div class="row g-2 mb-3">
          <div class="col-sm-4">
            <label class="form-label small fw-semibold" for="source-type">Upgrade source</label>
            <select class="form-select form-select-sm" id="source-type" onchange="onSourceTypeChange()">
              <option value="version" selected>Version tag</option>
              <option value="default">Default (latest release)</option>
              <option value="branch">Branch</option>
              <option value="commit">Commit SHA</option>
              <option value="source">Source tree path</option>
            </select>
          </div>
          <div class="col-sm-8" id="source-value-group" hidden>
            <label class="form-label small fw-semibold" for="source-value" id="source-value-label">Value</label>
            <input type="text" class="form-control form-control-sm" id="source-value">
          </div>
        </div>
        <div class="d-flex gap-4 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="chk-local">
            <label class="form-check-label" for="chk-local">--local</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="chk-boot">
            <label class="form-check-label" for="chk-boot">--boot</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="run-btn" disabled>Upgrade 0 selected</button>
        <span id="run-result" class="small ms-2"></span>
      </form>
    </div>
  </div>

  <h5 class="mb-2">Log</h5>
  <ul class="nav nav-tabs border-bottom-0" id="log-tabs" role="tablist"></ul>
  <div class="log-box" id="log">Pick a machine tab to follow its upgrade output.</div>
</div>

<dialog id="health-dialog">
  <div class="d-flex align-items-center justify-content-between border-bottom px-3 py-2">
    <h5 class="mb-0">Health <span class="text-muted small" id="health-host"></span></h5>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-outline-secondary" onclick="loadHealth()">Reload</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="$('health-dialog').close()" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="px-3 py-2" id="health-body"></div>
</dialog>

<script>
const BASE = {{ subdomain|tojson }};
const $ = id => document.getElementById(id);
const selected = new Set();
let machines = [];
let latest = null;
let stale = false;
const CACHE_KEY = `nexus-machines:${BASE}`;
const LATEST_KEY = `nexus-latest:${BASE}`;
let logSource = null;
let logHost = null;
// The last version auto-filled into the tag field; a user-typed value is never overwritten.
let autoVersion = '';
const ansi = window.AnsiUp ? new AnsiUp() : null;

const PLACEHOLDERS = {
  version: ['Version tag', 'e.g. 8.12.2'],
  branch: ['Branch', 'e.g. dev/feature'],
  commit: ['Commit SHA', 'git SHA'],
  source: ['Source tree path (same path on every machine)', '/absolute/path/to/anixpkgs'],
};

function onSourceTypeChange() {
  const t = $('source-type').value;
  $('source-value-group').hidden = t === 'default';
  if (PLACEHOLDERS[t]) {
    $('source-value-label').textContent = PLACEHOLDERS[t][0];
    $('source-value').placeholder = PLACEHOLDERS[t][1];
  }
  fillLatestVersion();
}

function fillLatestVersion() {
  const input = $('source-value');
  if ($('source-type').value !== 'version' || !latest) return;
  if (input.value.trim() !== '' && input.value.trim() !== autoVersion) return;
  input.value = autoVersion = latest;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badge(m) {
  if (!m.online) return '<span class="badge bg-secondary">offline</span>';
  if (!m.can_upgrade) return '<span class="badge bg-light text-muted border">no upgrade UI</span>';
  const s = m.upgrade_status || 'idle';
  const cls = {success: 'bg-success', failed: 'bg-danger', running: 'bg-warning text-dark'}[s] || 'bg-secondary';
  const spin = s === 'running' ? '<span class="spinner-border spinner-border-sm me-1" style="width:.7rem;height:.7rem"></span>' : '';
  return `<span class="badge ${cls}">${spin}${esc(s)}</span>`;
}

function versionMark(m) {
  if (m.behind_latest === true) return ` <span class="badge bg-warning text-dark" title="Behind master (${esc(latest)})">behind</span>`;
  if (m.behind_latest === false) return ' <span class="badge bg-success-subtle text-success-emphasis border" title="Matches master">latest</span>';
  return '';
}

function renderLatest() {
  $('latest-badge').hidden = !latest;
  $('latest-badge').textContent = latest ? `master: ${latest}` : '';
  fillLatestVersion();
}

function selectable(m) { return !stale && m.online && m.can_upgrade && m.upgrade_status !== 'running'; }

function render() {
  const rows = machines.map(m => {
    if (!selectable(m)) selected.delete(m.host);
    const homeLink = `<a class="btn ${m.online ? 'btn-primary' : 'btn-outline-primary'} home-btn" href="${esc(m.home_url)}" title="${esc(m.home_url)}">Home &rarr;</a>`;
    const healthBtn = m.can_upgrade && m.online && !stale
      ? `<button class="btn btn-sm btn-outline-success" onclick="showHealth('${esc(m.host)}')" title="bitd check results">Health</button>` : '';
    const forgetBtn = !m.online && !m.is_self
      ? `<button class="btn btn-sm btn-outline-danger" onclick="forget('${esc(m.host)}')" title="Remove from Nexus until it is rediscovered">Forget</button>` : '';
    // The host name and Home both open home_url (the IP when linkable); the
    // mDNS name stays available as an alternate link.
    const ip = [m.ip ? `<span class="small text-muted">${esc(m.ip)}</span>` : '',
      m.mdns_url ? `<a class="small text-muted" href="${esc(m.mdns_url)}">${esc(m.mdns)}</a>` : ''].filter(Boolean).join(' · ');
    const others = (m.other_ips || []).map(o => o.url
      ? `<a class="small text-muted" href="${esc(o.url)}">${esc(o.ip)}</a>`
      : `<span class="small text-muted">${esc(o.ip)}</span>`).join(' · ');
    const seen = !m.online && m.last_seen ? `<div class="small text-muted">last seen ${esc(m.last_seen)}</div>` : '';
    return `<tr class="${m.online ? '' : 'row-offline'}">
      <td><input class="form-check-input" type="checkbox" ${selectable(m) ? '' : 'disabled'}
           ${selected.has(m.host) ? 'checked' : ''} onchange="toggle('${esc(m.host)}', this.checked)"></td>
      <td><span class="dot ${m.online ? 'on' : 'off'} me-2" title="${m.online ? 'online' : 'offline'}"></span>
          <a class="host-name" href="${esc(m.home_url)}">${esc(m.host)}</a>${m.is_self ? ' <span class="badge bg-info">hub</span>' : ''}
          <div>${ip}${others ? ` <span class="small text-muted" title="Other interfaces">(also ${others})</span>` : ''}</div>${seen}</td>
      <td>${badge(m)}${versionMark(m)}
          ${m.version ? `<span class="font-monospace small trunc mt-1" title="${esc(m.version)}">${esc(m.version)}</span>` : ''}
          ${m.meta ? `<span class="small text-muted font-monospace trunc" title="${esc(m.meta)}">${esc(m.meta)}</span>` : ''}</td>
      <td class="text-end text-nowrap"><div class="d-inline-flex gap-1 row-actions">${homeLink}${healthBtn}${forgetBtn}</div></td>
    </tr>`;
  });
  $('machines').innerHTML = rows.length ? rows.join('')
    : '<tr><td colspan="4" class="text-muted text-center py-4">No machines advertise Nexus yet.</td></tr>';
  $('machines-card').classList.toggle('stale', stale);
  $('stale-note').hidden = !stale;
  renderLatest();
  renderLogTabs();
  updateRunBtn();
}

// One tab per online machine with an upgrade UI. Machines with no runs yet are
// listed but disabled; the followed machine keeps its tab even if it drops off.
function renderLogTabs() {
  const tabs = stale ? [] : machines.filter(m => m.online && m.can_upgrade);
  if (logHost && !tabs.some(m => m.host === logHost)) tabs.push({host: logHost, run_id: true});
  $('log-tabs').innerHTML = tabs.map(m => {
    const active = m.host === logHost;
    const running = m.upgrade_status === 'running'
      ? ' <span class="spinner-border spinner-border-sm text-primary ms-1" role="status" aria-label="upgrading"></span>' : '';
    const title = m.run_id ? '' : ' title="No upgrade runs yet"';
    return `<li class="nav-item" role="presentation"><button type="button" role="tab"
      class="nav-link ${active ? 'active' : ''}" aria-selected="${active}" ${m.run_id ? '' : 'disabled'}${title}
      onclick="followLog('${esc(m.host)}')">${esc(m.host)}${running}</button></li>`;
  }).join('');
}

function toggle(host, on) { on ? selected.add(host) : selected.delete(host); updateRunBtn(); }

function toggleAll(on) {
  machines.filter(selectable).forEach(m => on ? selected.add(m.host) : selected.delete(m.host));
  render();
}

function updateRunBtn() {
  $('run-btn').disabled = selected.size === 0;
  $('run-btn').textContent = `Upgrade ${selected.size} selected`;
}

async function refresh(force) {
  try {
    const r = await fetch(`${BASE}/api/machines${force ? '?refresh=1' : ''}`);
    const data = await r.json();
    machines = data.machines;
    // Keep the last known value if the hub briefly cannot reach GitHub.
    latest = data.latest || latest;
    stale = false;
    render();
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(machines));
      if (latest) localStorage.setItem(LATEST_KEY, latest);
    } catch (e) {}
  } catch (e) {
    console.error('refresh failed', e);
  }
}

async function forget(host) {
  await fetch(`${BASE}/api/forget/${encodeURIComponent(host)}`, {method: 'POST'});
  refresh(false);
}

function appendLog(text) {
  const log = $('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  const html = ansi ? ansi.ansi_to_html(text) : esc(text);
  log.insertAdjacentHTML('beforeend', html + '\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function followLog(host) {
  if (logSource) logSource.close();
  $('log').textContent = '';
  logHost = host;
  renderLogTabs();
  logSource = new EventSource(`${BASE}/api/stream/${encodeURIComponent(host)}`);
  logSource.onmessage = e => {
    if (e.data === '[DONE]') { logSource.close(); logSource = null; refresh(false); return; }
    appendLog(e.data);
  };
  logSource.onerror = () => {
    if (logSource) { logSource.close(); logSource = null; }
    appendLog('[nexus: log stream closed]');
  };
}

const CHECK_STATES = {
  STATE_PASSED: ['passed', 'bg-success'],
  STATE_FAILED: ['failed', 'bg-danger'],
  STATE_TIMED_OUT: ['timed out', 'bg-danger'],
  STATE_RUNNING: ['running', 'bg-warning text-dark'],
  STATE_IDLE: ['not run', 'bg-secondary'],
};
let healthHost = null;

function ago(ms) {
  if (!ms) return '';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 90) return `${s}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  if (s < 129600) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function renderCheck(c) {
  const [label, cls] = CHECK_STATES[c.state] || ['unknown', 'bg-secondary'];
  const bad = c.state === 'STATE_FAILED' || c.state === 'STATE_TIMED_OUT';
  const kind = c.kind === 'KIND_REGRESSION' ? 'regression' : 'health';
  const when = ago(c.finished_unix_ms || c.started_unix_ms);
  // Detail is often just the state name again; only show it when it adds something.
  const detail = c.detail && c.detail !== label ? `<div class="small text-muted">${esc(c.detail)}</div>` : '';
  const fix = bad && c.remediation ? `<pre>${esc(c.remediation)}</pre>` : '';
  return `<div class="check">
    <div class="d-flex align-items-center gap-2">
      <span class="badge ${cls}" style="min-width:4.5rem">${label}</span>
      <span class="fw-semibold">${esc(c.name)}</span>
      <span class="small text-muted">${kind}</span>
      <span class="small text-muted ms-auto" title="${when ? new Date(c.finished_unix_ms || c.started_unix_ms).toLocaleString() : ''}">${when}</span>
    </div>${detail}${fix}</div>`;
}

async function loadHealth() {
  const host = healthHost;
  const body = $('health-body');
  body.innerHTML = '<div class="text-muted py-2">Loading&hellip;</div>';
  try {
    const r = await fetch(`${BASE}/api/health/${encodeURIComponent(host)}`);
    const data = await r.json();
    if (host !== healthHost) return;
    if (!r.ok) { body.innerHTML = `<div class="text-danger py-2">${esc(data.error || 'Failed')}</div>`; return; }
    const checks = data.checks || [];
    if (!checks.length) { body.innerHTML = '<div class="text-muted py-2">No checks configured.</div>'; return; }
    // Failures first, then by name.
    const rank = c => (c.state === 'STATE_FAILED' || c.state === 'STATE_TIMED_OUT') ? 0 : 1;
    checks.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    const health = checks.filter(c => c.kind !== 'KIND_REGRESSION');
    const passing = health.filter(c => c.state === 'STATE_PASSED').length;
    body.innerHTML = `<div class="small text-muted mb-1">${passing}/${health.length} health checks passing</div>
      <div class="health-list">${checks.map(renderCheck).join('')}</div>`;
  } catch (e) {
    if (host === healthHost) body.innerHTML = `<div class="text-danger py-2">${esc(e)}</div>`;
  }
}

function showHealth(host) {
  healthHost = host;
  $('health-host').textContent = `${host}.local`;
  $('health-dialog').showModal();
  loadHealth();
}

$('upgrade-form').addEventListener('submit', async e => {
  e.preventDefault();
  const hosts = [...selected];
  if (!hosts.length) return;
  const body = {hosts, local: $('chk-local').checked, boot: $('chk-boot').checked};
  const t = $('source-type').value;
  if (t !== 'default') {
    const v = $('source-value').value.trim();
    if (!v) { $('run-result').textContent = 'Enter a value for the selected source.'; return; }
    body[t] = v;
  }
  $('run-btn').disabled = true;
  $('run-result').textContent = 'Starting…';
  try {
    const r = await fetch(`${BASE}/api/upgrade`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) { $('run-result').textContent = data.error || 'Failed'; return; }
    const parts = Object.entries(data.results).map(([h, res]) =>
      res.started ? `${h}: started` : `${h}: ${res.error}`);
    $('run-result').textContent = parts.join(' · ');
    selected.clear();
    await refresh(false);
    const first = Object.keys(data.results).find(h => data.results[h].started);
    if (first) followLog(first);
  } finally {
    updateRunBtn();
  }
});

// Show the last known list immediately; the live probe can take a few seconds.
function loadCached() {
  try {
    latest = localStorage.getItem(LATEST_KEY);
    renderLatest();
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (Array.isArray(cached) && cached.length) { machines = cached; stale = true; render(); }
  } catch (e) {}
}

onSourceTypeChange();
loadCached();
refresh(false);
setInterval(() => refresh(false), 5000);
</script>
</body>
</html>
