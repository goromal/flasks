<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Terminal</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { display: flex; flex-direction: column; }
    iframe { flex: 1 1 auto; width: 100%; border: 0; background: #000; }
    .agents-link {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 18px;
      padding: 8px 13px;
      border: 1px solid #526173;
      border-radius: 8px;
      background: #18212ee8;
      box-shadow: 0 4px 14px #0008;
      color: #eef4f8;
      font: 650 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
    }
    .agents-link:hover { background: #263548; }
    /* On-screen keys for phones, which have no physical arrows/Esc/Tab. */
    .keys {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      padding: 6px;
      background: #10151d;
      border-top: 1px solid #2d3b4c;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .keys button {
      flex: 1 0 auto;
      min-width: 46px;
      padding: 12px 10px;
      border: 1px solid #3a4b5e;
      border-radius: 8px;
      background: #1b2634;
      color: #eef4f8;
      font: 650 16px/1 system-ui, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .keys button:active { background: #2f81f7; }
  </style>
</head>
<body>
  <a class="agents-link" href="{{ subdomain }}/">Agents</a>
  <iframe id="term" src="{{ subdomain }}/terminal/?arg={{ name|urlencode }}" title="Agent terminal"></iframe>
  <nav class="keys" aria-label="Terminal keys">
    <button type="button" data-action="copy" title="Copy selected text, or the visible terminal">Copy</button>
    <button type="button" data-action="paste" title="Paste clipboard text into the terminal">Paste</button>
    <button type="button" data-key="Escape" data-code="27">Esc</button>
    <button type="button" data-key="Tab" data-code="9">Tab</button>
    <button type="button" data-key="ArrowUp" data-code="38">&uarr;</button>
    <button type="button" data-key="ArrowDown" data-code="40">&darr;</button>
    <button type="button" data-key="ArrowLeft" data-code="37">&larr;</button>
    <button type="button" data-key="ArrowRight" data-code="39">&rarr;</button>
    <button type="button" data-key="Enter" data-code="13">&crarr;</button>
    <button type="button" data-key="c" data-code="67" data-ctrl="1">^C</button>
  </nav>
  <script>
    (function () {
      var iframe = document.getElementById("term");

      // ttyd renders an xterm.js terminal; its keyboard handler lives on a
      // hidden helper textarea. Dispatching a synthetic keydown there is how we
      // feed arrows/Enter/Esc without a physical key. Same-origin (identical
      // host + scheme + port under this subdomain) makes the frame reachable.
      function textarea() {
        try {
          var doc = iframe.contentDocument;
          if (!doc) return null;
          return doc.querySelector(".xterm-helper-textarea") ||
                 doc.querySelector("textarea");
        } catch (err) {
          return null;
        }
      }

      function terminal() {
        try {
          return iframe.contentWindow.term || null;
        } catch (err) {
          return null;
        }
      }

      function flash(button, message) {
        var label = button.textContent;
        button.textContent = message;
        button.disabled = true;
        window.setTimeout(function () {
          button.textContent = label;
          button.disabled = false;
        }, 1200);
      }

      function terminalText(term) {
        var selected = term.getSelection();
        if (selected) return selected;

        var buffer = term.buffer.active;
        var lines = [];
        var end = Math.min(buffer.length, buffer.viewportY + term.rows);
        for (var row = buffer.viewportY; row < end; row++) {
          var line = buffer.getLine(row);
          lines.push(line ? line.translateToString(true) : "");
        }
        while (lines.length && !lines[lines.length - 1]) lines.pop();
        return lines.join("\n");
      }

      // Clipboard.writeText is unavailable outside secure contexts. Keep the
      // synchronous fallback for older mobile browsers as well.
      function legacyCopy(text) {
        var field = document.createElement("textarea");
        field.value = text;
        field.style.position = "fixed";
        field.style.top = "0";
        field.style.left = "0";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.contentEditable = "true";
        field.readOnly = false;

        var range = document.createRange();
        range.selectNodeContents(field);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        field.setSelectionRange(0, text.length);

        var copied = false;
        try {
          copied = document.execCommand("copy");
        } catch (err) {
          copied = false;
        }
        selection.removeAllRanges();
        field.remove();
        return copied;
      }

      function copy(button) {
        var term = terminal();
        if (!term) {
          flash(button, "Not ready");
          return;
        }
        var text = terminalText(term);
        if (!text) {
          flash(button, "Empty");
          term.focus();
          return;
        }

        function copied() {
          flash(button, "Copied!");
          term.focus();
        }
        function copyManually() {
          if (legacyCopy(text)) copied();
          else window.prompt("Copy the terminal text:", text);
        }

        if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(copied).catch(copyManually);
        } else {
          copyManually();
        }
      }

      function paste(button) {
        var term = terminal();
        if (!term) {
          flash(button, "Not ready");
          return;
        }

        function insert(text) {
          term.paste(text);
          term.focus();
          flash(button, "Pasted!");
        }
        function pasteManually() {
          var text = window.prompt("Paste clipboard text into the terminal:");
          if (text !== null) insert(text);
          else term.focus();
        }

        if (window.isSecureContext && navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText().then(insert).catch(pasteManually);
        } else {
          pasteManually();
        }
      }

      function sendKey(key, code, ctrl) {
        var ta = textarea();
        if (!ta) return;
        ta.focus();
        var view = iframe.contentWindow;
        var event = new view.KeyboardEvent("keydown", {
          key: key,
          ctrlKey: !!ctrl,
          bubbles: true,
          cancelable: true,
        });
        // The KeyboardEvent constructor ignores keyCode/which, but xterm's key
        // evaluation relies on them -- pin them explicitly.
        Object.defineProperty(event, "keyCode", { get: function () { return code; } });
        Object.defineProperty(event, "which", { get: function () { return code; } });
        ta.dispatchEvent(event);
      }

      document.querySelector('[data-action="copy"]').addEventListener("click", function (evt) {
        copy(evt.currentTarget);
      });
      document.querySelector('[data-action="paste"]').addEventListener("click", function (evt) {
        paste(evt.currentTarget);
      });

      var buttons = document.querySelectorAll(".keys button[data-key]");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", function (evt) {
          var el = evt.currentTarget;
          sendKey(el.dataset.key, Number(el.dataset.code), el.dataset.ctrl === "1");
        });
      }
    })();
  </script>
</body>
</html>
