<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            min-height: 100vh; display: flex; justify-content: center;
        }
        .card { background:#fff; width:100%; max-width:760px; margin:24px 16px; padding:24px; border-radius:16px;
                box-shadow:0 10px 40px rgba(0,0,0,0.2); display:flex; flex-direction:column; height:calc(100vh - 48px); }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        h1 { color:#4e73df; margin:0; font-size:1.6rem; font-weight:700; }
        a.logout { color:#4e73df; text-decoration:none; font-weight:600; }
        .controls { display:flex; gap:8px; align-items:center; }
        select { flex:1; min-width:0; padding:10px 12px; font-size:0.95rem; border:2px solid #ced4da; border-radius:8px; font-family:inherit; }
        button { padding:10px 18px; font-size:0.95rem; font-weight:600; color:#fff; border:none; border-radius:8px; cursor:pointer;
                 background:linear-gradient(135deg,#4e73df 0%,#224abe 100%); }
        button:disabled { opacity:0.5; cursor:not-allowed; }
        button.secondary { color:#4e73df; background:#fff; border:2px solid #4e73df; }
        #log { flex:1; overflow-y:auto; margin:16px 0; padding:4px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:85%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; line-height:1.4; }
        .msg.user { align-self:flex-end; background:#4e73df; color:#fff; border-bottom-right-radius:4px; }
        .msg.assistant { align-self:flex-start; background:#f1f3f5; color:#212529; border-bottom-left-radius:4px; }
        .status { color:#6c757d; font-style:italic; }
        details.thoughts { margin:0 0 6px; font-size:0.85rem; color:#6c757d; }
        details.thoughts summary { cursor:pointer; font-style:italic; }
        details.thoughts div { white-space:pre-wrap; margin-top:4px; padding-left:8px; border-left:3px solid #ced4da;
                               max-height:240px; overflow-y:auto; }
        label.think { display:flex; align-items:center; gap:6px; font-weight:600; color:#495057; white-space:nowrap; cursor:pointer; }
        label.think.unavailable { color:#adb5bd; cursor:not-allowed; }
        .msg.error { align-self:stretch; max-width:none; background:#f8d7da; color:#721c24; border:2px solid #f5c6cb; }
        .empty { color:#6c757d; text-align:center; margin:auto; }
        .compose { display:flex; gap:8px; align-items:flex-end; }
        textarea { flex:1; min-height:52px; max-height:200px; resize:vertical; padding:12px 14px; font-size:1rem;
                   border:2px solid #ced4da; border-radius:8px; font-family:inherit; }
        select:focus, textarea:focus { outline:none; border-color:#4e73df; box-shadow:0 0 0 3px rgba(78,115,223,0.15); }
        .hint { font-size:0.8rem; color:#6c757d; margin-top:6px; }
    </style>
</head>

<body>
    <div class="card">
        <div class="topbar">
            <h1>chat</h1>
            <a class="logout" href="{{ urlroot }}logout">Log out</a>
        </div>
        <div class="controls">
            <select id="model" aria-label="Model"></select>
            <label class="think" id="think-label" title="Let a reasoning model think before answering (slower)">
                <input type="checkbox" id="think" /> Think
            </label>
            <button type="button" class="secondary" id="clear">Clear</button>
        </div>
        <div id="log"><div class="empty" id="empty">Messages stay in this tab only; Clear forgets them.</div></div>
        <div class="compose">
            <textarea id="input" placeholder="Message" aria-label="Message"></textarea>
            <button type="button" id="send">Send</button>
        </div>
        <div class="hint">Enter sends · Shift+Enter for a new line</div>
    </div>

    <script>
        const root = "{{ urlroot }}";
        const modelSel = document.getElementById("model");
        const logEl = document.getElementById("log");
        const emptyEl = document.getElementById("empty");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const clearBtn = document.getElementById("clear");
        const thinkBox = document.getElementById("think");
        const thinkLabel = document.getElementById("think-label");
        const canThink = {};     // model name -> accepts think: true

        // The whole conversation, in this tab's memory only. The server keeps
        // nothing: each request carries the history it needs.
        let history = [];
        let controller = null;   // aborts the in-flight reply

        function bubble(cls, text) {
            emptyEl.style.display = "none";
            const el = document.createElement("div");
            el.className = "msg " + cls;
            el.textContent = text;   // plain text: model output is never HTML
            logEl.appendChild(el);
            logEl.scrollTop = logEl.scrollHeight;
            return el;
        }

        function busy(on) {
            sendBtn.disabled = on;
            modelSel.disabled = on;
            if (on) thinkBox.disabled = true; else syncThink();
        }

        // Think is off by default and only offered for models that can.
        function syncThink() {
            const ok = !!canThink[modelSel.value];
            thinkBox.disabled = !ok;
            thinkLabel.classList.toggle("unavailable", !ok);
            thinkLabel.title = ok ? "Let this model think before answering (slower)"
                                  : "This model does not think";
        }
        modelSel.addEventListener("change", syncThink);

        // An assistant bubble that shows the wait, the model's thinking as it
        // streams (collapsed once the answer starts), then the answer.
        function replyBubble() {
            const el = bubble("assistant", "");
            const status = document.createElement("div");
            status.className = "status";
            const thoughts = document.createElement("details");
            thoughts.className = "thoughts";
            thoughts.open = true;
            thoughts.style.display = "none";
            const summary = document.createElement("summary");
            const thoughtText = document.createElement("div");
            thoughts.append(summary, thoughtText);
            const answer = document.createElement("div");
            el.append(status, thoughts, answer);
            const started = Date.now();
            let phase = "waiting", thinkingSecs = 0;
            const secs = () => Math.round((Date.now() - started) / 1000);
            const tick = () => {
                if (phase === "waiting") status.textContent = "waiting for the model… " + secs() + " s";
                if (phase === "thinking") summary.textContent = "thinking… " + secs() + " s";
            };
            tick();
            const timer = setInterval(tick, 1000);
            const stop = () => clearInterval(timer);
            return {
                el,
                think(text) {
                    if (phase === "answering") return;
                    phase = "thinking";
                    status.style.display = "none";   // the summary carries the timer now
                    thoughts.style.display = "";
                    thoughtText.textContent += text;
                    thoughtText.scrollTop = thoughtText.scrollHeight;
                    tick();
                },
                answer(text) {
                    if (phase !== "answering") {
                        if (phase === "thinking") {
                            thinkingSecs = secs();
                            summary.textContent = "Thought for " + thinkingSecs + " s";
                            thoughts.open = false;
                        }
                        phase = "answering";
                        status.remove();
                        stop();
                    }
                    answer.textContent += text;
                },
                done: stop,
            };
        }

        async function loadModels() {
            try {
                const r = await fetch(root + "api/models");
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || "HTTP " + r.status);
                modelSel.innerHTML = "";
                for (const m of d.models) {
                    canThink[m.name] = m.thinking;
                    const o = document.createElement("option");
                    o.value = m.name;
                    o.textContent = m.name + (m.name === d.default ? " (default)" : "");
                    modelSel.appendChild(o);
                }
                if (d.default) modelSel.value = d.default;
                syncThink();
                if (!d.models.length) bubble("error", "No models are installed.");
            } catch (e) {
                bubble("error", "Cannot list models: " + e.message);
            }
        }

        async function send() {
            const text = input.value;
            if (!text.trim() || controller || !modelSel.value) return;
            input.value = "";
            history.push({ role: "user", content: text });
            bubble("user", text);
            const think = thinkBox.checked && !thinkBox.disabled;
            busy(true);
            const reply = replyBubble();
            controller = new AbortController();
            let answer = "";
            try {
                const r = await fetch(root + "api/chat", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ model: modelSel.value, messages: history, think: think }),
                    signal: controller.signal,
                });
                if (!r.ok) {
                    const d = await r.json().catch(() => ({}));
                    throw new Error(d.error || "HTTP " + r.status);
                }
                const reader = r.body.getReader();
                const decoder = new TextDecoder();
                let buf = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    let nl;
                    while ((nl = buf.indexOf("\n")) >= 0) {
                        const line = buf.slice(0, nl);
                        buf = buf.slice(nl + 1);
                        if (!line) continue;
                        const ev = JSON.parse(line);
                        if (ev.error) throw new Error(ev.error);
                        if (ev.t === "thinking") {
                            reply.think(ev.d);
                        } else if (ev.t === "content") {
                            answer += ev.d;
                            reply.answer(ev.d);
                        }
                        logEl.scrollTop = logEl.scrollHeight;
                    }
                }
                if (!answer) throw new Error("the model returned an empty reply");
                history.push({ role: "assistant", content: answer });
            } catch (e) {
                if (e.name === "AbortError") return;   // Clear already reset the view
                reply.el.remove();
                // Drop the unanswered message so the history stays well-formed.
                history.pop();
                bubble("error", e.message);
            } finally {
                reply.done();
                controller = null;
                busy(false);
                input.focus();
            }
        }

        function clearChat() {
            if (controller) controller.abort();
            history = [];
            logEl.querySelectorAll(".msg").forEach(el => el.remove());
            emptyEl.style.display = "";
            input.focus();
        }

        sendBtn.addEventListener("click", send);
        clearBtn.addEventListener("click", clearChat);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        });
        loadModels();
        input.focus();
    </script>
</body>

</html>
